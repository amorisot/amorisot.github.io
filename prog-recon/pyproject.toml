[project]
name = "progrecon"
version = "0.1.0"
description = "Program Reconstruction Scaling Study — engineering harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    # Provider SDK. Imported only when a real (non-mock) provider is configured
    # AND the relevant API key is present in env — but installed by default so
    # `uv sync` is enough to run real experiments (no extra to remember).
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
progrecon = "progrecon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/progrecon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # black handles line length

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # pydantic warns that a field named `schema` shadows BaseModel.schema();
    # the protocol mandates this field name, so we accept it explicitly.
    "ignore::UserWarning",
]
